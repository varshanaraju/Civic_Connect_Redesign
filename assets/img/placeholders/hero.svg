<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3A261A"/>
      <stop offset="50%" stop-color="#4E3424"/>
      <stop offset="100%" stop-color="#2D1C13"/>
    </linearGradient>
    <radialGradient id="lavenderCenterOrb" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#E6E0F0" stop-opacity="0.22"/>
      <stop offset="55%" stop-color="#C9BEE0" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#3A261A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="mochaCornerOrb" cx="15%" cy="85%" r="45%">
      <stop offset="0%" stop-color="#8B6347" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#2D1C13" stop-opacity="0"/>
    </radialGradient>

    <!-- Card Drop Shadow Filter -->
    <filter id="cardShadow" x="-20%" y="-15%" width="140%" height="145%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#140B07" flood-opacity="0.30"/>
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#140B07" flood-opacity="0.16"/>
    </filter>
  </defs>

  <!-- Deep Warm Mocha Backdrop -->
  <rect width="1600" height="1000" rx="32" fill="url(#bgGrad)"/>
  <rect width="1600" height="1000" rx="32" fill="url(#lavenderCenterOrb)"/>
  <rect width="1600" height="1000" rx="32" fill="url(#mochaCornerOrb)"/>

  <!-- Subtle Elegant Grid Pattern -->
  <g stroke="#E5E4E2" stroke-width="1" opacity="0.05">
    <line x1="0" y1="166" x2="1600" y2="166"/>
    <line x1="0" y1="333" x2="1600" y2="333"/>
    <line x1="0" y1="500" x2="1600" y2="500"/>
    <line x1="0" y1="666" x2="1600" y2="666"/>
    <line x1="0" y1="833" x2="1600" y2="833"/>
    <line x1="266" y1="0" x2="266" y2="1000"/>
    <line x1="533" y1="0" x2="533" y2="1000"/>
    <line x1="800" y1="0" x2="800" y2="1000"/>
    <line x1="1066" y1="0" x2="1066" y2="1000"/>
    <line x1="1333" y1="0" x2="1333" y2="1000"/>
  </g>

  <!-- Ambient Light Orbs behind the grid -->
  <circle cx="800" cy="500" r="480" fill="#E6E0F0" opacity="0.10"/>
  <circle cx="1350" cy="200" r="220" fill="#E5E4E2" opacity="0.06"/>
  <circle cx="250" cy="800" r="260" fill="#6F4E37" opacity="0.32"/>

  <!-- Outer Glass Border -->
  <rect x="2" y="2" width="1596" height="996" rx="30" fill="none" stroke="#E5E4E2" stroke-width="2" opacity="0.25"/>

  <!-- CENTERED 3x3 CATEGORY CARDS GRID -->
  <!-- Center calculation: Grid width = 3 * 220 + 2 * 40 = 740. Center X = (1600 - 740) / 2 = 430. -->
  <!-- Grid height = 3 * 220 + 2 * 40 = 740. Center Y = (1000 - 740) / 2 = 130. -->
  <g id="category-grid" transform="translate(430, 130)">
    
    <!-- CARD 1: All Citizens / Social Welfare (Row 1, Col 1) -->
    <g transform="translate(0, 0)" filter="url(#cardShadow)">
      <rect width="220" height="220" rx="28" fill="#FFFFFF"/>
      <rect width="220" height="220" rx="28" fill="none" stroke="#E5E4E2" stroke-width="1.5"/>
      <!-- Users Icon -->
      <g transform="translate(68, 52) scale(5.5)" fill="#6F4E37">
        <path d="M15 14s1 0 1-1-1-4-5-4-5 3-5 4 1 1 1 1zm-7.978-1L7 12.996c.001-.264.167-1.03.76-1.72C8.312 10.629 9.282 10 11 10c1.717 0 2.687.63 3.24 1.276.593.69.758 1.457.76 1.72l-.008.002-.014.002zM11 7a2 2 0 1 0 0-4 2 2 0 0 0 0 4m3-2a3 3 0 1 1-6 0 3 3 0 0 1 6 0M6.936 9.28a6 6 0 0 0-1.23-.247A7 7 0 0 0 5 9c-4 0-5 3-5 4q0 1 1 1h4.216A2.24 2.24 0 0 1 5 13c0-1.01.377-2.042 1.09-2.904.243-.294.526-.569.846-.816M4.92 10A5.5 5.5 0 0 0 4 13H1c0-.26.164-1.03.76-1.724.545-.636 1.492-1.256 3.16-1.275ZM1.5 5.5a3 3 0 1 1 6 0 3 3 0 0 1-6 0m3-2a2 2 0 1 0 0 4 2 2 0 0 0 0-4"/>
      </g>
      <text x="110" y="174" font-family="system-ui, -apple-system, 'Inter', sans-serif" font-size="15" font-weight="700" fill="#6F4E37" text-anchor="middle">Citizens</text>
      <rect x="40" y="196" width="140" height="8" rx="4" fill="#6F4E37"/>
    </g>

    <!-- CARD 2: Higher Education (Row 1, Col 2) -->
    <g transform="translate(260, 0)" filter="url(#cardShadow)">
      <rect width="220" height="220" rx="28" fill="#FFFFFF"/>
      <rect width="220" height="220" rx="28" fill="none" stroke="#E5E4E2" stroke-width="1.5"/>
      <!-- Graduation Cap Icon -->
      <g transform="translate(68, 52) scale(5.5)" fill="#8B6347">
        <path d="M8.211 2.047a.5.5 0 0 0-.422 0l-7.5 3.5a.5.5 0 0 0 .025.917l7.5 3a.5.5 0 0 0 .372 0L14 7.14V13a1 1 0 0 0-1 1v2h3v-2a1 1 0 0 0-1-1V6.739l.686-.275a.5.5 0 0 0 .025-.917zM8 8.46 1.758 5.965 8 3.052l6.242 2.913z"/>
        <path d="M4.176 9.032a.5.5 0 0 0-.656.327l-.5 1.7a.5.5 0 0 0 .294.605l4.5 1.8a.5.5 0 0 0 .372 0l4.5-1.8a.5.5 0 0 0 .294-.605l-.5-1.7a.5.5 0 0 0-.656-.327L8 10.466zm-.068 1.873.22-.748 3.496 1.311a.5.5 0 0 0 .352 0l3.496-1.311.22.748L8 12.46z"/>
      </g>
      <text x="110" y="174" font-family="system-ui, -apple-system, 'Inter', sans-serif" font-size="15" font-weight="700" fill="#6F4E37" text-anchor="middle">Education</text>
      <rect x="40" y="196" width="140" height="8" rx="4" fill="#C9BEE0"/>
    </g>

    <!-- CARD 3: Agriculture / Farmers (Row 1, Col 3) -->
    <g transform="translate(520, 0)" filter="url(#cardShadow)">
      <rect width="220" height="220" rx="28" fill="#FFFFFF"/>
      <rect width="220" height="220" rx="28" fill="none" stroke="#E5E4E2" stroke-width="1.5"/>
      <!-- Tree / Nature Icon -->
      <g transform="translate(68, 52) scale(5.5)" fill="#6F4E37">
        <path d="M8.416.223a.5.5 0 0 0-.832 0l-3 4.5A.5.5 0 0 0 5 5.5h.098L3.076 8.735A.5.5 0 0 0 3.5 9.5h.191l-1.638 3.276a.5.5 0 0 0 .447.724H7V16h2v-2.5h4.5a.5.5 0 0 0 .447-.724L12.31 9.5h.191a.5.5 0 0 0 .424-.765L10.902 5.5H11a.5.5 0 0 0 .416-.777zM6.437 4.758A.5.5 0 0 0 6 4.5h-.066L8 1.401 10.066 4.5H10a.5.5 0 0 0-.424.765L11.598 8.5H11.5a.5.5 0 0 0-.447.724L12.69 12.5H3.309l1.638-3.276A.5.5 0 0 0 4.5 8.5h-.098l2.022-3.235a.5.5 0 0 0 .013-.507"/>
      </g>
      <text x="110" y="174" font-family="system-ui, -apple-system, 'Inter', sans-serif" font-size="15" font-weight="700" fill="#6F4E37" text-anchor="middle">Farmers</text>
      <rect x="40" y="196" width="140" height="8" rx="4" fill="#6F4E37"/>
    </g>

    <!-- CARD 4: Healthcare & Wellness (Row 2, Col 1) -->
    <g transform="translate(0, 260)" filter="url(#cardShadow)">
      <rect width="220" height="220" rx="28" fill="#FFFFFF"/>
      <rect width="220" height="220" rx="28" fill="none" stroke="#E5E4E2" stroke-width="1.5"/>
      <!-- Heartbeat / Health Icon -->
      <g transform="translate(68, 52) scale(5.5)" fill="#8B6347">
        <path d="m8 2.748-.717-.737C5.6.281 2.514.878 1.4 3.053.918 3.995.78 5.323 1.508 7H.43c-2.128-5.697 4.165-8.83 7.394-5.857q.09.083.176.171a3 3 0 0 1 .176-.17c3.23-2.974 9.522.159 7.394 5.856h-1.078c.728-1.677.59-3.005.108-3.947C13.486.878 10.4.28 8.717 2.01zM2.212 10h1.315C4.593 11.183 6.05 12.458 8 13.795c1.949-1.337 3.407-2.612 4.473-3.795h1.315c-1.265 1.566-3.14 3.25-5.788 5-2.648-1.75-4.523-3.434-5.788-5"/>
        <path d="M10.464 3.314a.5.5 0 0 0-.945.049L7.921 8.956 6.464 5.314a.5.5 0 0 0-.88-.091L3.732 8H.5a.5.5 0 0 0 0 1H4a.5.5 0 0 0 .416-.223l1.473-2.209 1.647 4.118a.5.5 0 0 0 .945-.049l1.598-5.593 1.457 3.642A.5.5 0 0 0 12 9h3.5a.5.5 0 0 0 0-1h-3.162z"/>
      </g>
      <text x="110" y="174" font-family="system-ui, -apple-system, 'Inter', sans-serif" font-size="15" font-weight="700" fill="#6F4E37" text-anchor="middle">Healthcare</text>
      <rect x="40" y="196" width="140" height="8" rx="4" fill="#C9BEE0"/>
    </g>

    <!-- CARD 5: Public Transit (Row 2, Col 2) -->
    <g transform="translate(260, 260)" filter="url(#cardShadow)">
      <rect width="220" height="220" rx="28" fill="#FFFFFF"/>
      <rect width="220" height="220" rx="28" fill="none" stroke="#E5E4E2" stroke-width="1.5"/>
      <!-- Bus / Transit Icon -->
      <g transform="translate(68, 52) scale(5.5)" fill="#6F4E37">
        <path d="M5 11a1 1 0 1 1-2 0 1 1 0 0 1 2 0m8 0a1 1 0 1 1-2 0 1 1 0 0 1 2 0m-6-1a1 1 0 1 0 0 2h2a1 1 0 1 0 0-2zm1-6c-1.876 0-3.426.109-4.552.226A.5.5 0 0 0 3 4.723v3.554a.5.5 0 0 0 .448.497C4.574 8.891 6.124 9 8 9s3.426-.109 4.552-.226A.5.5 0 0 0 13 8.277V4.723a.5.5 0 0 0-.448-.497A44 44 0 0 0 8 4m0-1c-1.837 0-3.353.107-4.448.22a.5.5 0 1 1-.104-.994A44 44 0 0 1 8 2c1.876 0 3.426.109 4.552.226a.5.5 0 1 1-.104.994A43 43 0 0 0 8 3"/>
        <path d="M15 8a1 1 0 0 0 1-1V5a1 1 0 0 0-1-1V2.64c0-1.188-.845-2.232-2.064-2.372A44 44 0 0 0 8 0C5.9 0 4.208.136 3.064.268 1.845.408 1 1.452 1 2.64V4a1 1 0 0 0-1 1v2a1 1 0 0 0 1 1v3.5c0 .818.393 1.544 1 2v2a.5.5 0 0 0 .5.5h2a.5.5 0 0 0 .5-.5V14h6v1.5a.5.5 0 0 0 .5.5h2a.5.5 0 0 0 .5-.5v-2c.607-.456 1-1.182 1-2zM8 1c2.056 0 3.71.134 4.822.261.676.078 1.178.66 1.178 1.379v8.86a1.5 1.5 0 0 1-1.5 1.5h-9A1.5 1.5 0 0 1 2 11.5V2.64c0-.72.502-1.301 1.178-1.379A43 43 0 0 1 8 1"/>
      </g>
      <text x="110" y="174" font-family="system-ui, -apple-system, 'Inter', sans-serif" font-size="15" font-weight="700" fill="#6F4E37" text-anchor="middle">Transport</text>
      <rect x="40" y="196" width="140" height="8" rx="4" fill="#6F4E37"/>
    </g>

    <!-- CARD 6: Differently Abled (Row 2, Col 3) -->
    <g transform="translate(520, 260)" filter="url(#cardShadow)">
      <rect width="220" height="220" rx="28" fill="#FFFFFF"/>
      <rect width="220" height="220" rx="28" fill="none" stroke="#E5E4E2" stroke-width="1.5"/>
      <!-- Wheelchair / Inclusion Icon -->
      <g transform="translate(68, 52) scale(5.5)" fill="#8B6347">
        <path d="M12 3a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3m-.663 2.146a1.5 1.5 0 0 0-.47-2.115l-2.5-1.508a1.5 1.5 0 0 0-1.676.086l-2.329 1.75a.866.866 0 0 0 1.051 1.375L7.361 3.37l.922.71-2.038 2.445A4.73 4.73 0 0 0 2.628 7.67l1.064 1.065a3.25 3.25 0 0 1 4.574 4.574l1.064 1.063a4.73 4.73 0 0 0 1.09-3.998l1.043-.292-.187 2.991a.872.872 0 1 0 1.741.098l.206-4.121A1 1 0 0 0 12.224 8h-2.79zM3.023 9.48a3.25 3.25 0 0 0 4.496 4.496l1.077 1.077a4.75 4.75 0 0 1-6.65-6.65z"/>
      </g>
      <text x="110" y="174" font-family="system-ui, -apple-system, 'Inter', sans-serif" font-size="15" font-weight="700" fill="#6F4E37" text-anchor="middle">Special Needs</text>
      <rect x="40" y="196" width="140" height="8" rx="4" fill="#C9BEE0"/>
    </g>

    <!-- CARD 7: Employment & Skills (Row 3, Col 1) -->
    <g transform="translate(0, 520)" filter="url(#cardShadow)">
      <rect width="220" height="220" rx="28" fill="#FFFFFF"/>
      <rect width="220" height="220" rx="28" fill="none" stroke="#E5E4E2" stroke-width="1.5"/>
      <!-- Briefcase Icon -->
      <g transform="translate(68, 52) scale(5.5)" fill="#6F4E37">
        <path d="M6.5 1A1.5 1.5 0 0 0 5 2.5V3H1.5A1.5 1.5 0 0 0 0 4.5v8A1.5 1.5 0 0 0 1.5 14h13a1.5 1.5 0 0 0 1.5-1.5v-8A1.5 1.5 0 0 0 14.5 3H11v-.5A1.5 1.5 0 0 0 9.5 1zm0 1h3a.5.5 0 0 1 .5.5V3H6v-.5a.5.5 0 0 1 .5-.5m1.886 6.914L15 7.151V12.5a.5.5 0 0 1-.5.5h-13a.5.5 0 0 1-.5-.5V7.15l6.614 1.764a1.5 1.5 0 0 0 .772 0M1.5 4h13a.5.5 0 0 1 .5.5v1.616L8.129 7.948a.5.5 0 0 1-.258 0L1 6.116V4.5a.5.5 0 0 1 .5-.5"/>
      </g>
      <text x="110" y="174" font-family="system-ui, -apple-system, 'Inter', sans-serif" font-size="15" font-weight="700" fill="#6F4E37" text-anchor="middle">Employment</text>
      <rect x="40" y="196" width="140" height="8" rx="4" fill="#6F4E37"/>
    </g>

    <!-- CARD 8: Financial Support (Row 3, Col 2) -->
    <g transform="translate(260, 520)" filter="url(#cardShadow)">
      <rect width="220" height="220" rx="28" fill="#FFFFFF"/>
      <rect width="220" height="220" rx="28" fill="none" stroke="#E5E4E2" stroke-width="1.5"/>
      <!-- Money & Notes Icon -->
      <g transform="translate(68, 52) scale(5.5)" fill="#8B6347">
        <path fill-rule="evenodd" d="M11 15a4 4 0 1 0 0-8 4 4 0 0 0 0 8m5-4a5 5 0 1 1-10 0 5 5 0 0 1 10 0"/>
        <path d="M9.438 11.944c.047.596.518 1.06 1.363 1.116v.44h.375v-.443c.875-.061 1.386-.529 1.386-1.207 0-.618-.39-.936-1.09-1.1l-.296-.07v-1.2c.376.043.614.248.671.532h.658c-.047-.575-.54-1.024-1.329-1.073V8.5h-.375v.45c-.747.073-1.255.522-1.255 1.158 0 .562.378.92 1.007 1.066l.248.061v1.272c-.384-.058-.639-.27-.696-.563h-.668zm1.36-1.354c-.369-.085-.569-.26-.569-.522 0-.294.216-.514.572-.578v1.1zm.432.746c.449.104.655.272.655.569 0 .339-.257.571-.709.614v-1.195z"/>
        <path d="M1 0a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h4.083q.088-.517.258-1H3a2 2 0 0 0-2-2V3a2 2 0 0 0 2-2h10a2 2 0 0 0 2 2v3.528c.38.34.717.728 1 1.154V1a1 1 0 0 0-1-1z"/>
        <path d="M9.998 5.083 10 5a2 2 0 1 0-3.132 1.65 6 6 0 0 1 3.13-1.567"/>
      </g>
      <text x="110" y="174" font-family="system-ui, -apple-system, 'Inter', sans-serif" font-size="15" font-weight="700" fill="#6F4E37" text-anchor="middle">Financial Aid</text>
      <rect x="40" y="196" width="140" height="8" rx="4" fill="#C9BEE0"/>
    </g>

    <!-- CARD 9: Women & Child Welfare (Row 3, Col 3) -->
    <g transform="translate(520, 520)" filter="url(#cardShadow)">
      <rect width="220" height="220" rx="28" fill="#FFFFFF"/>
      <rect width="220" height="220" rx="28" fill="none" stroke="#E5E4E2" stroke-width="1.5"/>
      <!-- Female Symbol Icon -->
      <g transform="translate(68, 52) scale(5.5)" fill="#6F4E37">
        <path fill-rule="evenodd" d="M8 1a4 4 0 1 0 0 8 4 4 0 0 0 0-8M3 5a5 5 0 1 1 5.5 4.975V12h2a.5.5 0 0 1 0 1h-2v2.5a.5.5 0 0 1-1 0V13h-2a.5.5 0 0 1 0-1h2V9.975A5 5 0 0 1 3 5"/>
      </g>
      <text x="110" y="174" font-family="system-ui, -apple-system, 'Inter', sans-serif" font-size="15" font-weight="700" fill="#6F4E37" text-anchor="middle">Women Welfare</text>
      <rect x="40" y="196" width="140" height="8" rx="4" fill="#6F4E37"/>
    </g>

  </g>
</svg>