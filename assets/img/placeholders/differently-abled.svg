<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="daBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF7F5"/>
      <stop offset="50%" stop-color="#F3ECE6"/>
      <stop offset="100%" stop-color="#EBE2DA"/>
    </linearGradient>
    <radialGradient id="daGlow" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#E6E0F0" stop-opacity="0.7"/>
      <stop offset="60%" stop-color="#FAF7F5" stop-opacity="0"/>
    </radialGradient>
    <filter id="daShadow" x="-20%" y="-15%" width="140%" height="145%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#4A3425" flood-opacity="0.14"/>
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#4A3425" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#daBg)"/>
  <rect width="800" height="500" fill="url(#daGlow)"/>

  <!-- Orbits -->
  <circle cx="690" cy="90" r="140" fill="#E6E0F0" opacity="0.35"/>
  <circle cx="110" cy="420" r="160" fill="#6F4E37" opacity="0.05"/>
  <g stroke="#E5E4E2" stroke-width="1.5" opacity="0.4" fill="none">
    <circle cx="400" cy="230" r="150" stroke-dasharray="6 6"/>
    <circle cx="400" cy="230" r="180"/>
  </g>

  <!-- Central Card -->
  <g transform="translate(290, 120)" filter="url(#daShadow)">
    <rect width="220" height="220" rx="36" fill="#FFFFFF" stroke="#E5E4E2" stroke-width="1.5"/>
    <rect x="20" y="20" width="180" height="180" rx="28" fill="#FBF9F7"/>

    <!-- Inclusion / Wheelchair Icon -->
    <g transform="translate(74, 52) scale(4.5)">
      <path d="M12 3a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3m-.663 2.146a1.5 1.5 0 0 0-.47-2.115l-2.5-1.508a1.5 1.5 0 0 0-1.676.086l-2.329 1.75a.866.866 0 0 0 1.051 1.375L7.361 3.37l.922.71-2.038 2.445A4.73 4.73 0 0 0 2.628 7.67l1.064 1.065a3.25 3.25 0 0 1 4.574 4.574l1.064 1.063a4.73 4.73 0 0 0 1.09-3.998l1.043-.292-.187 2.991a.872.872 0 1 0 1.741.098l.206-4.121A1 1 0 0 0 12.224 8h-2.79zM3.023 9.48a3.25 3.25 0 0 0 4.496 4.496l1.077 1.077a4.75 4.75 0 0 1-6.65-6.65z" fill="#6F4E37"/>
    </g>

    <rect x="70" y="184" width="80" height="8" rx="4" fill="#6F4E37"/>
  </g>

  <!-- Category Label Banner -->
  <g transform="translate(400, 400)">
    <rect x="-105" y="0" width="210" height="34" rx="17" fill="#FFFFFF" stroke="#E5E4E2" stroke-width="1.2"/>
    <circle cx="-83" cy="17" r="5" fill="#6F4E37"/>
    <text x="7" y="22" font-family="system-ui, -apple-system, 'Inter', sans-serif" font-size="12" font-weight="700" fill="#6F4E37" letter-spacing="1.2" text-anchor="middle">DIFFERENTLY ABLED</text>
  </g>
</svg>