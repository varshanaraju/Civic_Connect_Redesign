<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="edBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF7F5"/>
      <stop offset="50%" stop-color="#F3ECE6"/>
      <stop offset="100%" stop-color="#EBE2DA"/>
    </linearGradient>
    <radialGradient id="edGlow" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#E6E0F0" stop-opacity="0.7"/>
      <stop offset="60%" stop-color="#FAF7F5" stop-opacity="0"/>
    </radialGradient>
    <filter id="edShadow" x="-20%" y="-15%" width="140%" height="145%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#4A3425" flood-opacity="0.14"/>
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#4A3425" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#edBg)"/>
  <rect width="800" height="500" fill="url(#edGlow)"/>

  <!-- Orbits -->
  <circle cx="690" cy="90" r="140" fill="#E6E0F0" opacity="0.35"/>
  <circle cx="110" cy="420" r="160" fill="#6F4E37" opacity="0.05"/>
  <g stroke="#E5E4E2" stroke-width="1.5" opacity="0.4" fill="none">
    <circle cx="400" cy="230" r="150" stroke-dasharray="6 6"/>
    <circle cx="400" cy="230" r="180"/>
  </g>

  <!-- Central Card -->
  <g transform="translate(290, 120)" filter="url(#edShadow)">
    <rect width="220" height="220" rx="36" fill="#FFFFFF" stroke="#E5E4E2" stroke-width="1.5"/>
    <rect x="20" y="20" width="180" height="180" rx="28" fill="#FBF9F7"/>

    <!-- Graduation Cap & Tassel -->
    <g transform="translate(74, 52) scale(4.5)">
      <path d="M8.211 2.047a.5.5 0 0 0-.422 0l-7.5 3.5a.5.5 0 0 0 .025.917l7.5 3a.5.5 0 0 0 .372 0L14 7.14V13a1 1 0 0 0-1 1v2h3v-2a1 1 0 0 0-1-1V6.739l.686-.275a.5.5 0 0 0 .025-.917z" fill="#6F4E37"/>
      <path d="M4.176 9.032a.5.5 0 0 0-.656.327l-.5 1.7a.5.5 0 0 0 .294.605l4.5 1.8a.5.5 0 0 0 .372 0l4.5-1.8a.5.5 0 0 0 .294-.605l-.5-1.7a.5.5 0 0 0-.656-.327L8 10.466z" fill="#8B6347"/>
      <!-- Soft Lavender Tassel / Sparkle -->
      <circle cx="15.5" cy="14" r="1.5" fill="#C9BEE0"/>
    </g>

    <rect x="70" y="184" width="80" height="8" rx="4" fill="#C9BEE0"/>
  </g>

  <!-- Category Label Banner -->
  <g transform="translate(400, 400)">
    <rect x="-105" y="0" width="210" height="34" rx="17" fill="#FFFFFF" stroke="#E5E4E2" stroke-width="1.2"/>
    <circle cx="-83" cy="17" r="5" fill="#6F4E37"/>
    <text x="7" y="22" font-family="system-ui, -apple-system, 'Inter', sans-serif" font-size="12" font-weight="700" fill="#6F4E37" letter-spacing="1.2" text-anchor="middle">EDUCATION &amp; SCHOLARSHIPS</text>
  </g>
</svg>