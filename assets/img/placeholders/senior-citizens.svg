<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="scBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF7F5"/>
      <stop offset="50%" stop-color="#F3ECE6"/>
      <stop offset="100%" stop-color="#EBE2DA"/>
    </linearGradient>
    <radialGradient id="scGlow" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#E6E0F0" stop-opacity="0.7"/>
      <stop offset="60%" stop-color="#FAF7F5" stop-opacity="0"/>
    </radialGradient>
    <filter id="scShadow" x="-20%" y="-15%" width="140%" height="145%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#4A3425" flood-opacity="0.14"/>
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#4A3425" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#scBg)"/>
  <rect width="800" height="500" fill="url(#scGlow)"/>

  <!-- Orbits -->
  <circle cx="690" cy="90" r="140" fill="#E6E0F0" opacity="0.35"/>
  <circle cx="110" cy="420" r="160" fill="#6F4E37" opacity="0.05"/>
  <g stroke="#E5E4E2" stroke-width="1.5" opacity="0.4" fill="none">
    <circle cx="400" cy="230" r="150" stroke-dasharray="6 6"/>
    <circle cx="400" cy="230" r="180"/>
  </g>

  <!-- Central Card -->
  <g transform="translate(290, 120)" filter="url(#scShadow)">
    <rect width="220" height="220" rx="36" fill="#FFFFFF" stroke="#E5E4E2" stroke-width="1.5"/>
    <rect x="20" y="20" width="180" height="180" rx="28" fill="#FBF9F7"/>

    <!-- Senior Citizen Icon -->
    <g transform="translate(74, 52) scale(4.5)">
      <path d="M9.5 1.5a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0M6.44 3.752A.75.75 0 0 1 7 3.5h1.445c.742 0 1.32.643 1.243 1.38l-.43 4.083a1.8 1.8 0 0 1-.088.395l-.318.906.213.242a.8.8 0 0 1 .114.175l2 4.25a.75.75 0 1 1-1.357.638l-1.956-4.154-1.68-1.921A.75.75 0 0 1 6 8.96l.138-2.613-.435.489-.464 2.786a.75.75 0 1 1-1.48-.246l.5-3a.75.75 0 0 1 .18-.375l2-2.25Z" fill="#6F4E37"/>
      <path d="M6.25 11.745v-1.418l1.204 1.375.261.524a.8.8 0 0 1-.12.231l-2.5 3.25a.75.75 0 1 1-1.19-.914zm4.22-4.215-.494-.494.205-1.843.006-.067 1.124 1.124h1.44a.75.75 0 0 1 0 1.5H11a.75.75 0 0 1-.531-.22Z" fill="#8B6347"/>
    </g>

    <rect x="70" y="184" width="80" height="8" rx="4" fill="#6F4E37"/>
  </g>

  <!-- Category Label Banner -->
  <g transform="translate(400, 400)">
    <rect x="-85" y="0" width="170" height="34" rx="17" fill="#FFFFFF" stroke="#E5E4E2" stroke-width="1.2"/>
    <circle cx="-63" cy="17" r="5" fill="#6F4E37"/>
    <text x="7" y="22" font-family="system-ui, -apple-system, 'Inter', sans-serif" font-size="12" font-weight="700" fill="#6F4E37" letter-spacing="1.2" text-anchor="middle">SENIOR CITIZENS</text>
  </g>
</svg>