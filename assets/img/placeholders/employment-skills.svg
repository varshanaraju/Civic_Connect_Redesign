<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="esBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF7F5"/>
      <stop offset="50%" stop-color="#F3ECE6"/>
      <stop offset="100%" stop-color="#EBE2DA"/>
    </linearGradient>
    <radialGradient id="esGlow" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#E6E0F0" stop-opacity="0.7"/>
      <stop offset="60%" stop-color="#FAF7F5" stop-opacity="0"/>
    </radialGradient>
    <filter id="esShadow" x="-20%" y="-15%" width="140%" height="145%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#4A3425" flood-opacity="0.14"/>
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#4A3425" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#esBg)"/>
  <rect width="800" height="500" fill="url(#esGlow)"/>

  <!-- Orbits -->
  <circle cx="690" cy="90" r="140" fill="#E6E0F0" opacity="0.35"/>
  <circle cx="110" cy="420" r="160" fill="#6F4E37" opacity="0.05"/>
  <g stroke="#E5E4E2" stroke-width="1.5" opacity="0.4" fill="none">
    <circle cx="400" cy="230" r="150" stroke-dasharray="6 6"/>
    <circle cx="400" cy="230" r="180"/>
  </g>

  <!-- Central Card -->
  <g transform="translate(290, 120)" filter="url(#esShadow)">
    <rect width="220" height="220" rx="36" fill="#FFFFFF" stroke="#E5E4E2" stroke-width="1.5"/>
    <rect x="20" y="20" width="180" height="180" rx="28" fill="#FBF9F7"/>

    <!-- Briefcase / Portfolio Icon -->
    <g transform="translate(74, 52) scale(4.5)">
      <path d="M6.5 1A1.5 1.5 0 0 0 5 2.5V3H1.5A1.5 1.5 0 0 0 0 4.5v8A1.5 1.5 0 0 0 1.5 14h13a1.5 1.5 0 0 0 1.5-1.5v-8A1.5 1.5 0 0 0 14.5 3H11v-.5A1.5 1.5 0 0 0 9.5 1zm0 1h3a.5.5 0 0 1 .5.5V3H6v-.5a.5.5 0 0 1 .5-.5z" fill="#8B6347"/>
      <path d="M1.5 4h13a.5.5 0 0 1 .5.5v1.616L8.129 7.948a.5.5 0 0 1-.258 0L1 6.116V4.5a.5.5 0 0 1 .5-.5z" fill="#6F4E37"/>
      <path d="M8.386 8.914L15 7.151V12.5a.5.5 0 0 1-.5.5h-13a.5.5 0 0 1-.5-.5V7.15l6.614 1.764a1.5 1.5 0 0 0 .772 0z" fill="#6F4E37"/>
    </g>

    <rect x="70" y="184" width="80" height="8" rx="4" fill="#6F4E37"/>
  </g>

  <!-- Category Label Banner -->
  <g transform="translate(400, 400)">
    <rect x="-95" y="0" width="190" height="34" rx="17" fill="#FFFFFF" stroke="#E5E4E2" stroke-width="1.2"/>
    <circle cx="-73" cy="17" r="5" fill="#6F4E37"/>
    <text x="7" y="22" font-family="system-ui, -apple-system, 'Inter', sans-serif" font-size="12" font-weight="700" fill="#6F4E37" letter-spacing="1.2" text-anchor="middle">EMPLOYMENT &amp; SKILLS</text>
  </g>
</svg>