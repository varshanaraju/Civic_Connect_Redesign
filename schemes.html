<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="CivicConnect — bilingual guide to 15 selected government schemes.">
  <title data-i18n-title="title.discover">Discover schemes · CivicConnect</title>
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/vendor/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="assets/vendor/bootstrap-icons/bootstrap-icons.min.css">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body data-page="discover" data-base="">
  <div id="app-header"></div>
  <main id="main" tabindex="-1">

    <div class="container page-head pb-3">
      <h1 data-i18n="disc.h1">Discover schemes</h1>
      <p data-i18n="disc.sub">Search by scheme name, benefit or document, and narrow down with filters.</p>
      <form class="search-bar mt-3" id="search-form" role="search" style="max-width:720px">
        <i class="bi bi-search" aria-hidden="true"></i>
        <label for="q" class="visually-hidden" data-i18n="home.searchLabel">Search schemes</label>
        <input id="q" name="q" class="form-control" placeholder="Search schemes, benefits or documents" data-i18n-ph="home.searchPh" maxlength="255" autocomplete="off">
      </form>
    </div>
    <div class="container">
      <div class="row g-4">
        <aside class="col-lg-3 d-none d-lg-block"><div class="panel position-sticky" style="top:90px" id="filters-desktop"><div class="filter-panel">
              <div class="filter-group"><h2 data-i18n="filter.category">Category</h2><div class="d-grid gap-1" data-f="cats"></div></div>
              <div class="filter-group"><h2 data-i18n="filter.type">Scheme type</h2><div class="seg" role="radiogroup" data-f="level"></div></div>
              <div class="filter-group" data-f="mine-wrap" hidden><div class="form-check form-switch"><input class="form-check-input" type="checkbox" role="switch" data-f="mine"><label class="form-check-label fw-semibold" data-i18n="filter.mine">Show only my matches</label></div></div>
            </div></div></aside>
        <section class="col-lg-9" aria-labelledby="res-count">
          <div class="d-flex flex-wrap gap-2 align-items-center justify-content-between mb-3">
            <p class="mb-0 fw-semibold" id="res-count" aria-live="polite"></p>
            <div class="d-flex flex-wrap gap-2 align-items-center">
              <button class="btn btn-outline-primary d-lg-none" type="button" data-bs-toggle="offcanvas" data-bs-target="#filters-sheet"><i class="bi bi-sliders" aria-hidden="true"></i><span data-i18n="filter.filters">Filters</span> <span id="f-count"></span></button>
              <label for="sort" class="small text-muted text-nowrap" data-i18n="filter.sort">Sort by</label>
              <select id="sort" class="form-select form-select-sm" style="min-height:44px;width:auto"><option value="rel" data-i18n="filter.relevance">Relevance</option><option value="az" data-i18n="filter.az">A – Z</option></select>
            </div>
          </div>
          <div class="d-flex flex-wrap gap-2 mb-3" id="active-chips"></div>
          <div class="row row-cols-1 row-cols-md-2 g-3" id="results"></div>
        </section>
      </div>
    </div>
    <div class="offcanvas offcanvas-bottom filters-sheet" tabindex="-1" id="filters-sheet" aria-labelledby="fs-title">
      <div class="offcanvas-header border-bottom"><h2 class="offcanvas-title h5" id="fs-title" data-i18n="filter.filters">Filters</h2><button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close" data-i18n-aria="common.close"></button></div>
      <div class="offcanvas-body" id="filters-mobile"><div class="filter-panel">
              <div class="filter-group"><h2 data-i18n="filter.category">Category</h2><div class="d-grid gap-1" data-f="cats"></div></div>
              <div class="filter-group"><h2 data-i18n="filter.type">Scheme type</h2><div class="seg" role="radiogroup" data-f="level"></div></div>
              <div class="filter-group" data-f="mine-wrap" hidden><div class="form-check form-switch"><input class="form-check-input" type="checkbox" role="switch" data-f="mine"><label class="form-check-label fw-semibold" data-i18n="filter.mine">Show only my matches</label></div></div>
            </div></div>
      <div class="p-3 border-top d-flex gap-2"><button class="btn btn-outline-primary flex-fill" type="button" id="clear-mobile" data-i18n="filter.clear">Clear all</button><button class="btn btn-primary flex-fill" type="button" data-bs-dismiss="offcanvas" id="apply-mobile" data-i18n="filter.show">Show results</button></div>
    </div>
  </main>
  <div id="app-footer"></div>

  <script src="assets/vendor/bootstrap/bootstrap.bundle.min.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/lang/ta.js"></script>
  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/store.js?v=20261024b"></script>
  <script src="assets/js/match.js?v=20261024b"></script>
  <script src="assets/js/chatbot.js?v=20261024b"></script>
  <script src="assets/js/ui.js?v=20261024b"></script>
  <script src="assets/js/pages/schemes.js?v=20261024b"></script>
</body>
</html>
